name: Validate Comet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate command UI on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMET_TEST_PLENARY: ${{ github.workspace }}/.test-deps/plenary.nvim
    steps:
      - name: Check out Comet
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare pinned Plenary sources
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/nvim-lua/plenary.nvim.git "$COMET_TEST_PLENARY"
          git -C "$COMET_TEST_PLENARY" checkout 74b06c6c75e4eeb3108ec01852001636d85a932b
      - name: Install Lua validation tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validation/bin"
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/validation"
          curl -fsSL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/just.tar.gz"
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  $RUNNER_TEMP/just.tar.gz" | sha256sum -c
          tar -xf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/validation/bin" just
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.4.0/stylua-linux-x86_64.zip -o "$RUNNER_TEMP/stylua.zip"
          echo "f9c84c210712061cb03ab8354a34a5d4f5fcf1f369d2ce916bea3ab9f7addac8  $RUNNER_TEMP/stylua.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/validation/bin"
          chmod +x "$RUNNER_TEMP/validation/bin/stylua"
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0-1
          echo "$RUNNER_TEMP/validation/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/validation/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Validate Lua and command behavior
        run: just all
